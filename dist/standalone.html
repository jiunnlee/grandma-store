<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>阿嬤的小店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 版面概念：手機直式優先，上半是等距小店場景，下半是對話／帳本面板，像一本翻開的帳簿。 */
:root {
  --bg: #E6F2EF;          /* 薄荷底 */
  --surface: #FFFFFF;
  --surface-2: #F3F8F6;
  --ink: #1F3A4D;         /* 主要文字 */
  --ink-2: #557385;       /* 次要文字 */
  --line: #CFE0DB;
  --primary: #1F6F8F;     /* 主色：海藍 */
  --primary-ink: #FFFFFF;
  --gold: #FFC93C;        /* 金幣 */
  --gold-ink: #6B4A00;
  --roof: #E4572E;        /* 屋頂紅，用在警示與強調 */
  --good: #2E8B57;
  --bad: #C9431F;
  --warn: #C98F00;
  --sky: #CDEBF5;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 14px;
  --shadow: 0 6px 20px rgba(31, 58, 77, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F2027; --surface: #163039; --surface-2: #1C3944; --ink: #E6F2EF; --ink-2: #9FBAC6; --line: #2A4C58;
    --primary: #4FA3C4; --primary-ink: #06202B; --gold: #FFC93C; --gold-ink: #3B2800; --roof: #F07A57;
    --good: #5CC98A; --bad: #F0805F; --warn: #F5C451; --sky: #1E3F4D; --shadow: 0 6px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F2027; --surface: #163039; --surface-2: #1C3944; --ink: #E6F2EF; --ink-2: #9FBAC6; --line: #2A4C58;
  --primary: #4FA3C4; --primary-ink: #06202B; --gold: #FFC93C; --gold-ink: #3B2800; --roof: #F07A57;
  --good: #5CC98A; --bad: #F0805F; --warn: #F5C451; --sky: #1E3F4D; --shadow: 0 6px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.25; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.hidden-el { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.screen { display: flex; flex-direction: column; gap: 12px; }

/* 場景 */
.scene { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--sky); box-shadow: var(--shadow); }
.scene svg { display: block; width: 100%; height: auto; }
.scene[data-time="morning"] { --sky-top: #BFE4F2; --sky-bot: #FFF2C8; }
.scene[data-time="noon"]    { --sky-top: #9ED8F0; --sky-bot: #E6F6FB; }
.scene[data-time="evening"] { --sky-top: #F4A261; --sky-bot: #FFD6A5; }
.scene[data-time="night"]   { --sky-top: #1B2A4A; --sky-bot: #3A4F7A; }
.scene .sky { fill: url(#skyGrad); transition: fill 600ms; }
.scene .day-badge {
  position: absolute; top: 10px; left: 10px; background: var(--surface); color: var(--ink);
  padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; box-shadow: var(--shadow);
}
.scene .weather-badge { position: absolute; top: 10px; right: 10px; font-size: 22px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }

/* 資源列 */
.hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat {
  background: var(--surface); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--line); min-width: 0;
}
.stat .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 4px; letter-spacing: 0.04em; }
.stat .value { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width 500ms; }
.stat[data-k="stress"] .bar i { background: var(--roof); }
.stat[data-k="pop"] .bar i { background: var(--good); }
.stat[data-k="credit"] .bar i { background: var(--gold); }
.stat .delta { font-size: 12px; font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.help-btn {
  border: 0; background: var(--surface-2); color: var(--ink-2); width: 18px; height: 18px; border-radius: 50%;
  font-size: 11px; font-weight: 800; line-height: 18px; padding: 0; cursor: pointer; flex: none;
}
.help-btn:hover { background: var(--gold); color: var(--gold-ink); }

/* 面板 */
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 20px; font-weight: 900; }
.panel h3 { font-size: 15px; font-weight: 800; color: var(--ink-2); letter-spacing: 0.04em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--primary); text-transform: uppercase; }
.muted { color: var(--ink-2); font-size: 14px; }

.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; font-size: 16px; cursor: pointer;
  background: var(--primary); color: var(--primary-ink); transition: transform 120ms, filter 120ms; min-height: 48px;
}
.btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(0.98); }
.btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }

/* 對話 */
.dialog { display: flex; gap: 10px; align-items: flex-start; }
.avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 24px; background: var(--surface-2); border: 2px solid var(--line); }
.bubble { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 0; position: relative; }
.bubble .who { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 2px; }
.bubble .text { white-space: pre-line; }

/* 新聞 */
.news { display: flex; flex-direction: column; gap: 6px; }
.news-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.news-item .icon { font-size: 18px; flex: none; }
.news-item.delayed { border-left: 4px solid var(--gold); }

/* 進貨與定價 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input[type="range"] { flex: 1; accent-color: var(--primary); min-width: 0; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 900; font-size: 18px; cursor: pointer; }
.stepper .val { min-width: 64px; text-align: right; font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.preview { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preview .kv { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.preview .kv .k { font-size: 12px; color: var(--ink-2); }
.preview .kv .v { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
.tip { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; background: color-mix(in srgb, var(--gold) 20%, var(--surface)); border-radius: 10px; font-size: 14px; }
.tip .icon { flex: none; }

/* 事件卡 */
.card-ev { border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); position: relative; }
.card-ev .title { font-weight: 900; font-size: 18px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px; transition: border-color 120ms, transform 120ms; min-height: 48px;
}
.opt:hover { border-color: var(--primary); } .opt:active { transform: scale(0.99); }
.opt .l { font-weight: 800; }
.opt .k { font-size: 12px; color: var(--ink-2); }
.timer { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--roof); width: 100%; transition: width 1s linear; }
.result-box { padding: 12px 14px; border-radius: 12px; background: var(--surface); border-left: 4px solid var(--primary); white-space: pre-line; }
.result-box.delta-up { border-left-color: var(--good); } .result-box.delta-down { border-left-color: var(--bad); }

/* 帳本 */
.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
.ledger td { padding: 6px 4px; border-bottom: 1px dashed var(--line); }
.ledger td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.ledger tr.total td { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 900; font-size: 17px; }
.ledger .neg { color: var(--bad); } .ledger .pos { color: var(--good); }

/* 關卡地圖 */
.levels { display: flex; flex-direction: column; gap: 10px; }
.level-card {
  display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface);
  border: 2px solid var(--line); cursor: pointer; text-align: left; width: 100%;
}
.level-card:hover:not(:disabled) { border-color: var(--primary); }
.level-card:disabled { opacity: .55; cursor: not-allowed; }
.level-card .no { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-weight: 900; flex: none; }
.level-card:disabled .no { background: var(--line); color: var(--ink-2); }
.level-card .t { font-weight: 900; font-size: 17px; }
.level-card .s { font-size: 13px; color: var(--ink-2); }
.level-card .stars { margin-left: auto; color: var(--gold); font-size: 18px; letter-spacing: 1px; flex: none; }
.chapter-head { display: flex; align-items: baseline; justify-content: space-between; }

/* 結算 */
.settle-hero { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 8px 0; }
.settle-hero .stars { font-size: 34px; color: var(--gold); letter-spacing: 4px; }
.settle-hero .title-badge { display: inline-block; margin: 0 auto; background: var(--gold); color: var(--gold-ink); border-radius: 999px; padding: 6px 16px; font-weight: 900; }
.chart { width: 100%; height: auto; display: block; }
.replay-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.replay-item .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.06em; }
.tag.judgement { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); color: var(--primary); }
.tag.luck { background: color-mix(in srgb, var(--gold) 35%, var(--surface)); color: var(--gold-ink); }
.world { font-size: 14px; color: var(--ink-2); padding-left: 10px; border-left: 3px solid var(--line); }

/* 圖鑑 */
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.term-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; min-height: 48px; }
.term-card:disabled { opacity: .5; cursor: default; }
.term-card .n { font-weight: 900; font-size: 16px; }
.term-card .p { font-size: 12px; color: var(--ink-2); }
button.term {
  background: none; border: 0; padding: 0 2px; cursor: pointer; font-weight: 800; color: var(--primary);
  text-decoration: underline dotted; text-underline-offset: 3px; border-radius: 4px;
}

/* 底部說明卡 */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px;
  padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow: auto;
  animation: up 200ms ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h3 { font-size: 20px; font-weight: 900; color: var(--ink); }
.sheet .row { display: flex; gap: 10px; align-items: flex-start; }
.sheet .row .icon { flex: none; width: 28px; text-align: center; }
.sheet .row .k { font-size: 12px; color: var(--ink-2); font-weight: 800; letter-spacing: .06em; }

/* 教學 */
.coach { border: 2px dashed var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.coach .icon { font-size: 22px; flex: none; }
.coach .text { flex: 1; font-size: 14px; }
.coach button { align-self: center; }

/* 標題畫面 */
.logo { text-align: center; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
.logo .kicker { font-size: 14px; letter-spacing: 0.3em; color: var(--ink-2); font-weight: 700; }
.logo h1 { font-size: 34px; font-weight: 900; color: var(--primary); }
.logo .sub { font-size: 14px; color: var(--ink-2); }
.diff-row { display: flex; gap: 6px; }
.diff-row .chip { flex: 1; text-align: center; }
.footer-note { font-size: 12px; color: var(--ink-2); text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 700; z-index: 40; box-shadow: var(--shadow); }
.coin-pop { position: absolute; font-weight: 900; color: var(--gold-ink); background: var(--gold); border-radius: 999px; padding: 2px 10px; animation: rise 1.2s ease-out forwards; pointer-events: none; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .back { background: none; border: 0; font-weight: 800; color: var(--primary); cursor: pointer; padding: 6px 4px; min-height: 44px; }
.fade-in { animation: fade 250ms ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 銀行與篇章 */
.bankline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); padding: 2px 4px; }
.bankline b { color: var(--ink); }
.bank { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.bank input[type="range"] { width: 100%; accent-color: var(--primary); }
.row-kv { display: grid; grid-template-columns: 88px 1fr; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.chapter-done { border: 2px solid var(--gold); }
.opt:disabled { opacity: .55; cursor: not-allowed; }
.bank + .bank { margin-top: 2px; }

/* 投資面板 */
.mkt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.mkt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mkt-name { display: flex; align-items: center; gap: 6px; }
.mkt-price { font-weight: 900; font-size: 17px; }
.mkt-price .up { color: var(--good); font-size: 13px; } .mkt-price .down { color: var(--bad); font-size: 13px; }
.mkt-body { display: flex; gap: 10px; align-items: flex-start; }
.mkt-body .spark { width: 120px; height: 32px; flex: none; }
.mkt-desc { font-size: 13px; flex: 1; min-width: 0; }
.mkt-hold { font-size: 13px; }
.risk { color: var(--roof); font-size: 10px; letter-spacing: 1px; }
.mkt-card input[type="range"] { accent-color: var(--gold); }

</style>

<script>
/* 淘氣大亨：阿嬤的小店 — 遊戲引擎（純邏輯，瀏覽器與 Node 共用）
 * 設計重點：
 *  - 所有亂數都由 (seed, day, 用途) 決定，與玩家先前的選擇無關，
 *    因此「平行世界」回放只要換一個選項重跑，運氣完全相同，差異就是判斷。
 *  - step(data, state, action) 是純函式：回傳新的 state，不修改舊的。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- 亂數 ----------
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFor(seed, day, salt) {
    return mulberry32(hashStr(String(seed) + '|' + day + '|' + salt));
  }

  const DIFF = {
    easy:   { label: '輕鬆', noise: 0.10, goalMul: 0.6, rentMul: 0.8, timer: 0 },
    normal: { label: '標準', noise: 0.20, goalMul: 1.0, rentMul: 1.0, timer: 0 },
    hard:   { label: '挑戰', noise: 0.30, goalMul: 1.2, rentMul: 1.15, timer: 20 },
  };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- 建立關卡 ----------
  function createLevel(data, levelId, difficulty, seed) {
    const lv = data.levels.find((l) => l.id === levelId);
    if (!lv) throw new Error('沒有這一關：' + levelId);
    const d = DIFF[difficulty] || DIFF.normal;
    return {
      levelId, difficulty, seed: String(seed),
      day: 1, days: lv.days, phase: 'morning',
      cash: lv.startCash, pop: lv.startPop, stress: 10, credit: lv.startCredit === undefined ? 60 : lv.startCredit,
      goal: Math.round(lv.startCash + (lv.extraStart || 0) + lv.goalProfit * d.goalMul),
      rent: Math.round(lv.rent * d.rentMul),
      stock: [],               // [{qty, cost}] 進貨批次（含前一天剩下的）
      today: null,             // 今天的資訊
      scheduled: [],           // 延遲後果 [{day, cash, pop, stress, demandMult, text}]
      flags: Object.assign({}, lv.startFlags || {}),
      loans: (lv.startLoans || []).map((l) => Object.assign({}, l)),  // [{principal, daily, daysLeft, rate, name}]
      insured: !!lv.startInsured,
      priceLevel: 1,            // 物價水準（通膨用）
      usedEvents: [],
      actions: [],             // 玩家所有輸入，用來重播
      replay: [],              // 重大決定紀錄（結算用）
      history: [{ day: 0, cash: lv.startCash, pop: lv.startPop, stress: 10 }],
      dayRecords: [],
      learned: [],             // 學到的名詞
      nightLine: '',
      bank: { demand: 0, fixed: [] }, // 活存餘額、定存 [{amount, matureDay, rate}]
      done: false,
    };
  }

  // ---------- 工具 ----------
  function stockQty(s) { return s.stock.reduce((a, b) => a + b.qty, 0); }
  function stockCost(s) { return s.stock.reduce((a, b) => a + b.qty * b.cost, 0); }
  function levelOf(data, s) { return data.levels.find((l) => l.id === s.levelId); }
  function productOf(data, s) {
    const lv = levelOf(data, s);
    return data.products[lv.product];
  }
  function learn(s, terms) {
    (terms || []).forEach((t) => { if (!s.learned.includes(t)) s.learned.push(t); });
  }
  function bankOf(s) { if (!s.bank) s.bank = { demand: 0, fixed: [] }; return s.bank; }
  function bankCfgOf(lv, s) { return lv.bank ? Object.assign({}, lv.bank, s.bankOverride || {}) : null; }
  function loanOutstanding(s) { return (s.loans || []).reduce((a, l) => a + l.daily * l.daysLeft, 0); }
  // ---------- 虛構市場 ----------
  function marketOf(s) { if (!s.market) s.market = { prices: {}, hist: {}, holdings: {}, margin: 0, trades: [], fees: 0, dividends: 0 }; return s.market; }
  function marketProducts(data, lv) { return lv.market ? lv.market.products.map((id) => Object.assign({ id }, data.market[id])) : []; }
  function holdingValue(s, id) { const m = marketOf(s); const h = m.holdings[id]; return h ? h.units * (m.prices[id] || 0) : 0; }
  function holdingsValue(s) { const m = marketOf(s); return Object.keys(m.holdings).reduce((a, id) => a + holdingValue(s, id), 0); }
  function assets(s) { const b = bankOf(s); return Math.round(s.cash + b.demand + b.fixed.reduce((a, f) => a + f.amount, 0) - loanOutstanding(s) + holdingsValue(s) - (s.market ? s.market.margin : 0)); }
  // 用一筆現金買進（含買進手續費）
  function marketBuy(data, s, id, cash, why) {
    const m = marketOf(s); const p = data.market[id]; if (!p || cash <= 0 || !m.prices[id]) return 0;
    cash = Math.round(Math.min(cash, Math.max(0, s.cash)));
    if (cash <= 0) return 0;
    const fee = Math.round(cash * (p.buyFee || 0));
    const units = (cash - fee) / m.prices[id];
    const h = m.holdings[id] || { units: 0, cost: 0 };
    h.units += units; h.cost += cash; m.holdings[id] = h;
    s.cash -= cash; m.fees += fee;
    m.trades.push({ day: s.day, id, kind: 'buy', cash, units, price: m.prices[id], why: why || '' });
    learn(s, ['風險', '報酬']);
    return units;
  }
  // 賣出某個金額（或 'all' 全部）
  function marketSell(data, s, id, cash, why) {
    const m = marketOf(s); const h = m.holdings[id]; if (!h || !m.prices[id]) return 0;
    const p = data.market[id];
    if (p && p.freezeFrom && s.day >= p.freezeFrom && why !== '斷頭') { m.frozen = m.frozen || {}; m.frozen[id] = true; return 0; } // 假平台：出金被卡住
    const value = h.units * m.prices[id];
    const amt = cash === 'all' ? value : Math.min(cash, value);
    if (amt <= 0) return 0;
    const units = amt / m.prices[id];
    const frac = units / h.units;
    h.units -= units; h.cost = Math.round(h.cost * (1 - frac));
    if (h.units < 1e-6 || cash === 'all') delete m.holdings[id];
    s.cash += Math.round(amt);
    m.trades.push({ day: s.day, id, kind: 'sell', cash: Math.round(amt), units, price: m.prices[id], why: why || '' });
    return amt;
  }
  // 融資：還能借多少（自有資產 ×(倍數−1) − 已借）
  function marginRoom(lv, s) {
    if (!lv.market || !lv.market.margin) return 0;
    const m = marketOf(s); const equity = Math.max(0, s.cash + holdingsValue(s) - m.margin);
    return Math.max(0, Math.floor((equity * (lv.market.margin.maxMul - 1) - m.margin) / 1000) * 1000);
  }
  function marginBorrow(lv, s, amount, why) {
    const amt = Math.min(Math.max(0, Math.round(amount)), marginRoom(lv, s)); if (amt <= 0) return 0;
    const m = marketOf(s); m.margin += amt; s.cash += amt; m.trades.push({ day: s.day, kind: 'margin', cash: amt, why: why || '' }); learn(s, ['融資', '槓桿']); return amt;
  }
  function marginRepay(lv, s, amount) {
    const m = marketOf(s); const amt = Math.min(Math.max(0, Math.round(amount)), m.margin, Math.max(0, s.cash)); if (amt <= 0) return 0;
    m.margin -= amt; s.cash -= amt; m.trades.push({ day: s.day, kind: 'repay', cash: amt }); return amt;
  }
  // 信用越差，借錢越貴
  function creditMul(credit) { return credit >= 70 ? 0.8 : credit >= 50 ? 1 : credit >= 30 ? 1.5 : 2; }
  function loanTerms(lv, s, amount) {
    const cfg = lv.loan; const rate = cfg.rate * creditMul(s.credit);
    const total = Math.round(amount * (1 + rate * cfg.days));
    return { principal: amount, total, daily: Math.ceil(total / cfg.days), daysLeft: cfg.days, rate, days: cfg.days };
  }
  function makeLoan(lv, s, amount, name) {
    const t = loanTerms(lv, s, amount); t.name = name || '銀行貸款';
    s.loans = s.loans || []; s.loans.push(t); s.cash += amount; learn(s, ['貸款', '利息']);
    return t;
  }
  // 客人現在接受的參考價（通膨時大家都漲，客人會慢慢接受）
  function refPriceNow(data, s) {
    const prod = productOf(data, s); const pl = s.priceLevel || 1;
    const accept = s.flags.acceptRaise ? 1 : 0.5;
    const war = s.flags.priceWar ? 0.9 : 1; // 價格戰：客人只肯付九折
    return Math.round(prod.refPrice * (1 + (pl - 1) * accept) * war);

  function branchOf(lv, s) { return lv.branch && s.flags.branch ? lv.branch[s.flags.branch] : null; }
  function optsOf(ev, s) { return typeof ev.options === 'function' ? ev.options(s) : ev.options; }
  function optionAllowed(opt, s) { return !(opt.minCash && s.cash < opt.minCash); }
  function capacityOf(lv, s) {
    let c = lv.capacity || Infinity;
    const br = branchOf(lv, s); if (br && br.capacity && c !== Infinity) c += br.capacity;
    if (lv.staff && s.today && s.today.hired && !s.today.absent) c += lv.staff.capacity;
    if (s.today && s.today.capacityAdd) c += s.today.capacityAdd;
    return c;
  }
  function unitCost(product, qty, s) {
    let c = product.cost * (s.priceLevel || 1);
    if (s.flags.costMul) c = c * s.flags.costMul;
    if (product.bulk && qty >= product.bulk.qty) c = c * (1 - product.bulk.discount);
    return Math.round(c * 10) / 10;
  }

  // 價格對客人數的影響（參考價為 1，貴了掉得快，便宜增得慢）
  function priceFactor(price, ref) {
    const r = ref / price;
    return r >= 1 ? Math.pow(r, 0.8) : Math.pow(r, 1.8);
  }

  function pickEvent(data, lv, s) {
    const climax = lv.climax && lv.climax.day === s.day ? data.events.find((e) => e.id === lv.climax.event) : null;
    if (climax) return climax;
    const fixedId = lv.fixedEvents && lv.fixedEvents[s.day];
    if (fixedId) return data.events.find((e) => e.id === fixedId);
    const rng = rngFor(s.seed, s.day, 'event');
    const pool = lv.pool
      .map((id) => data.events.find((e) => e.id === id))
      .filter((e) => e && !s.usedEvents.includes(e.id) && (!e.cond || e.cond(s)));
    if (!pool.length) return data.events.find((e) => e.id === 'quiet');
    return pool[Math.floor(rng() * pool.length)];
  }

  // 預估今天的客人（阿嬤會把這個講給玩家聽；只給區間，不給精確值）
  function estimateCustomers(data, s) {
    const lv = levelOf(data, s);
    const br = branchOf(lv, s);
    const base = lv.baseCustomers * (br ? br.demandMult : 1) * (0.5 + s.pop / 100) * (s.today ? s.today.demandMult : 1);
    return Math.round(base);
  }

  // ---------- 一步 ----------
  function step(data, prev, action) {
    const s = clone(prev);
    const lv = levelOf(data, s);
    const prod = productOf(data, s);
    const d = DIFF[s.difficulty] || DIFF.normal;
    if (s.done) return s;
    s.actions.push(action);

    switch (s.phase) {
      case 'morning': {
        // 延遲後果到期
        const bank = bankOf(s);
        const news0 = [];
        // 虛構市場：今天的行情（亂數只看種子與天數，和玩家做過什麼無關）
        if (lv.market) {
          const m = marketOf(s); const mk = lv.market;
          const noiseScale = d.noise / 0.2;
          const scripts = (mk.script && mk.script[s.day]) || [];
          if (Array.isArray(scripts) === false) { /* 單一物件也接受 */ }
          const list = Array.isArray(scripts) ? scripts : [scripts];
          mk.products.forEach((id) => {
            const p = data.market[id];
            if (m.prices[id] === undefined) { m.prices[id] = p.start; m.hist[id] = [p.start]; if (lv.startMarket && lv.startMarket[id]) { m.holdings[id] = { units: lv.startMarket[id] / p.start, cost: lv.startMarket[id] }; m.trades.push({ day: 0, id, kind: 'buy', cash: lv.startMarket[id], units: m.holdings[id].units, price: p.start, why: '上一關留下' }); } return; }
            const rng = rngFor(s.seed, s.day, 'mkt-' + id);
            let mult = 1 + (p.drift || 0) + (rng() * 2 - 1) * (p.vol || 0) * noiseScale;
            list.filter((x) => x.id === id && x.mult !== undefined).forEach((x) => { mult *= x.mult; });
            const np = Math.round(m.prices[id] * mult * 100) / 100;
            m.prices[id] = np; m.hist[id].push(np);
            // 配息／利息
            const h = m.holdings[id];
            if (h && p.payout) {
              if (p.payoutIn === 'units') { h.units *= 1 + p.payout; }
              else { const dv = Math.round(h.units * np * p.payout); if (dv > 0) { s.cash += dv; m.dividends += dv; news0.push({ icon: '💰', text: p.name + ' 配息入帳 +' + dv.toLocaleString() + ' 元。', cash: dv }); learn(s, ['股息']); } }
            }
            if (h && p.dailyFee) { h.units *= 1 - p.dailyFee; m.fees += Math.round(h.units * np * p.dailyFee); }
          });
          list.forEach((x) => { if (x.news) news0.push({ icon: x.icon || '📰', text: x.news, delayed: true }); if (x.bank) s.bankOverride = Object.assign({}, s.bankOverride || {}, x.bank); if (x.flag) s.flags[x.flag] = true; if (x.demandMult) { s.flags.scriptDemand = x.demandMult; } });
          // 融資利息與斷頭
          if (m.margin > 0) {
            const it = Math.round(m.margin * mk.margin.rate); m.margin += it;
            const hv = holdingsValue(s);
            if (hv < m.margin * mk.margin.maintain) {
              let got = 0;
              Object.keys(m.holdings).forEach((id) => { got += marketSell(data, s, id, 'all', '斷頭'); });
              const repay = Math.min(s.cash, m.margin); s.cash -= repay; const left = m.margin - repay; m.margin = 0;
              s.flags.liquidated = true; s.stress = clamp(s.stress + 30, 0, 100); s.credit = clamp(s.credit - 15, 0, 100);
              news0.push({ icon: '💥', text: '斷頭通知：持股跌到維持率以下，券商把你的部位全部賣掉還錢。' + (left > 0 ? '剩下的 ' + Math.round(left).toLocaleString() + ' 元差額券商先認列（信用重傷）。' : ''), delayed: true });
              learn(s, ['爆倉']);
            } else news0.push({ icon: '💳', text: '融資利息 ' + it.toLocaleString() + ' 元加進欠款，目前欠 ' + Math.round(m.margin).toLocaleString() + ' 元。' });
          }
        }
        const bankCfg = bankCfgOf(lv, s);
        if (lv.inflation && s.day >= (lv.inflation.fromDay || 2)) {
          const before = s.priceLevel || 1; s.priceLevel = Math.round(before * (1 + lv.inflation.daily) * 1000) / 1000;
          news0.push({ icon: '📈', text: '物價又漲了：進貨成本變成原本的 ' + Math.round(s.priceLevel * 100) + '%。' });

        }
        if (s.flags.skipRepay) { s.flags.skipRepay = false; s.flags.skippedOnce = true; }
        (s.loans || []).forEach((l) => {
          if (l.daysLeft <= 0) return;
          if (s.flags.skippedOnce && !l.skippedApplied) { l.skippedApplied = true; news0.push({ icon: '🙈', text: l.name + '：今天的還款你沒繳。' }); return; }
          const pay = l.daily;
          if (s.cash < pay) { const take = Math.min(bank.demand, pay - s.cash); bank.demand -= take; s.cash += take; }
          if (s.cash >= pay) { s.cash -= pay; l.daysLeft -= 1; s.credit = clamp(s.credit + 1, 0, 100); news0.push({ icon: '🏦', text: l.name + '：今天還款 ' + pay.toLocaleString() + ' 元' + (l.daysLeft ? '，還剩 ' + l.daysLeft + ' 期。' : '，全部還清！'), cash: -pay }); }
          else { l.missed = (l.missed || 0) + 1; s.credit = clamp(s.credit - 10, 0, 100); s.stress = clamp(s.stress + 8, 0, 100); const pen = Math.round(pay * 0.1); l.daily += Math.ceil(pen / Math.max(1, l.daysLeft)); news0.push({ icon: '⚠️', text: l.name + '：手上現金不夠還今天的 ' + pay.toLocaleString() + ' 元，延遲繳款。信用掉了，還多了 ' + pen.toLocaleString() + ' 元違約金。' }); learn(s, ['信用']); }
        });
        s.loans = (s.loans || []).filter((l) => l.daysLeft > 0);
        if (lv.insurance && s.insured) { s.cash -= lv.insurance.premium; news0.push({ icon: '🛡️', text: '店面保險保費 ' + lv.insurance.premium.toLocaleString() + ' 元。', cash: -lv.insurance.premium }); }
        if (bankCfg && bank.demand > 0) {

        }
        if (bankCfg && bank.fixed.length) {

          matured.forEach((f) => { const it = Math.round(f.amount * f.rate * f.days); s.cash += f.amount + it; news0.push({ icon: '🏦', text: '定存到期：本金 ' + f.amount.toLocaleString() + ' 元加利息 ' + it.toLocaleString() + ' 元回到手上。', cash: f.amount + it }); });
        }
        const due = s.scheduled.filter((x) => x.day === s.day);
        s.scheduled = s.scheduled.filter((x) => x.day !== s.day);
        const weatherRng = rngFor(s.seed, s.day, 'weather');
        const wr = weatherRng();
        let weather = wr < 0.18 ? 'rain' : wr < 0.3 ? 'hot' : 'sunny';
        if (lv.weather && lv.weather[s.day]) weather = lv.weather[s.day];
        const wMul = { rain: 0.7, hot: 1.15, sunny: 1.0, typhoon: 0 }[weather];
        let demandMult = wMul;
        const news = news0;
        if (weather === 'rain') news.push({ icon: '🌧️', text: '今天下雨，客人會少一些。' });
        if (weather === 'hot') news.push({ icon: '☀️', text: '今天很熱，路上人潮多。' });
        if (s.flags.scriptDemand) { demandMult *= s.flags.scriptDemand; delete s.flags.scriptDemand; }
        due.forEach((x) => {
          if (x.cash) s.cash += x.cash;
          if (x.stockAdd) s.stock.push({ qty: x.stockAdd.qty, cost: x.stockAdd.cost });
          if (x.fxCash && s.market) { const now = s.market.prices[x.fxCash.id] || x.fxCash.ref; const amt = Math.round(x.fxCash.amount * now / x.fxCash.ref); s.cash -= amt; news.push({ icon: '💱', text: x.fxCash.text + '以今天的匯率付了 ' + amt.toLocaleString() + ' 元' + (amt > x.fxCash.amount ? '（比當初多 ' + (amt - x.fxCash.amount).toLocaleString() + '）' : '（比當初少 ' + (x.fxCash.amount - amt).toLocaleString() + '）') + '。', delayed: true, cash: -amt }); }
          if (x.pop) s.pop = clamp(s.pop + x.pop, 0, 100);
          if (x.stress) s.stress = clamp(s.stress + x.stress, 0, 100);
          if (x.demandMult) demandMult *= x.demandMult;
          if (x.flag) s.flags[x.flag] = x.flagValue === undefined ? true : x.flagValue;
          if (x.text) news.push({ icon: x.icon || '📬', text: x.text, delayed: true, cash: x.cash || 0 });
          if (x.replayNote) {
            const r = s.replay.find((r) => r.id === x.replayNote.id);
            if (r) r.outcome = x.replayNote.text;
          }
        });
        // 明天的預告（讓玩家能預先規劃）
        const tomorrow = s.scheduled.filter((x) => x.day === s.day + 1 && x.forecast);
        tomorrow.forEach((x) => news.push({ icon: '🔮', text: x.forecast }));
        const ev = pickEvent(data, lv, s);
        s.usedEvents.push(ev.id);
        s.today = {
          weather, demandMult, news, eventId: ev.id,
          leftover: stockQty(s),
          estimate: null, hired: false, absent: false,
        };
        if (lv.demandByDay && lv.demandByDay[s.day]) { s.today.demandMult *= lv.demandByDay[s.day]; if (lv.demandByDay[s.day] < 0.9) news.push({ icon: '🍂', text: '淡季，路上人少。' }); }
        if (lv.weather && lv.weather[s.day] === 'typhoon') { s.today.demandMult = 0; s.today.closed = true; news.push({ icon: '🌀', text: '颱風天，全市停班停課，今天沒有客人。房租照付。' }); }

      }
      case 'shop': {
        const qty = Math.max(0, Math.round(action.qty || 0));

        const cost = Math.round(qty * uc);

        const ev = data.events.find((e) => e.id === s.today.eventId);
        const opts = optsOf(ev, s);
        let idx = clamp(action.opt | 0, 0, opts.length - 1);
        if (!optionAllowed(opts[idx], s)) idx = opts.findIndex((o) => optionAllowed(o, s));
        if (idx < 0) idx = 0;
        const opt = opts[idx];
        const allowedBefore = opts.map((o) => optionAllowed(o, s));
        const rng = rngFor(s.seed, s.day, 'event-roll');
        const roll = rng();
        const fx = typeof opt.effects === 'function' ? opt.effects(s, roll) : (opt.effects || {});
        const before = assets(s);
        if (fx.cash) s.cash += fx.cash;
        if (fx.pop) s.pop = clamp(s.pop + fx.pop, 0, 100);
        if (fx.stress) s.stress = clamp(s.stress + fx.stress, 0, 100);
        if (fx.credit) s.credit = clamp(s.credit + fx.credit, 0, 100);
        if (fx.demandMult) s.today.demandMult *= fx.demandMult;
        if (fx.stockAdd) s.stock.push({ qty: fx.stockAdd.qty, cost: fx.stockAdd.cost });
        if (fx.stockLose) { // 丟掉一部分庫存
          let lose = fx.stockLose; const kept = [];
          s.stock.forEach((b) => { const l = Math.min(b.qty, lose); lose -= l; if (b.qty - l > 0) kept.push({ qty: b.qty - l, cost: b.cost }); });
          s.stock = kept;
        }
        if (fx.flag) Object.assign(s.flags, fx.flag);
        if (fx.scamLoss) s.flags.scamLoss = (s.flags.scamLoss || 0) + fx.scamLoss;
        if (fx.dodge) s.flags.scamDodged = (s.flags.scamDodged || 0) + 1;
        if (fx.absent) s.today.absent = true;
        if (fx.borrow && lv.loan) makeLoan(lv, s, fx.borrow, fx.loanName);
        if (fx.insure !== undefined) s.insured = !!fx.insure;
        if (fx.priceLevel) s.priceLevel = Math.round((s.priceLevel || 1) * fx.priceLevel * 1000) / 1000;
        if (fx.capacityAdd) s.today.capacityAdd = (s.today.capacityAdd || 0) + fx.capacityAdd;
        if (fx.bankDemand) { bankOf(s).demand += fx.bankDemand; }
        if (fx.bankFixed) { const b = bankCfgOf(lv, s) || { fixedRate: 0.004, fixedDays: 3 }; bankOf(s).fixed.push({ amount: fx.bankFixed, matureDay: s.day + b.fixedDays, rate: b.fixedRate, days: b.fixedDays }); }
        if (fx.marketMult && s.market) { Object.keys(fx.marketMult).forEach((id) => { if (s.market.prices[id]) { s.market.prices[id] = Math.round(s.market.prices[id] * fx.marketMult[id] * 100) / 100; s.market.hist[id][s.market.hist[id].length - 1] = s.market.prices[id]; } }); }
        if (fx.marginBorrow) marginBorrow(lv, s, fx.marginBorrow, ev.title);
        (fx.invest || []).forEach((iv) => marketBuy(data, s, iv.id, iv.cash, ev.title));
        if (fx.sellAll && s.market) Object.keys(s.market.holdings).forEach((id) => marketSell(data, s, id, 'all', ev.title));
        (fx.sell || []).forEach((sv) => marketSell(data, s, sv.id, sv.cash || 'all', ev.title));
        if (s.cash < 0) { const b = bankOf(s); const take = Math.min(b.demand, -s.cash); b.demand -= take; s.cash += take; }
        (fx.schedule || []).forEach((sc) => s.scheduled.push(Object.assign({}, sc, { day: s.day + sc.after })));
        learn(s, ev.terms);
        const resultText = typeof opt.result === 'function' ? opt.result(s, roll, fx) : opt.result;
        s.today.eventChoice = idx;
        s.today.eventResult = resultText;
        s.today.eventDelta = assets(s) - before;
        if (!(typeof ev.minor === 'function' ? ev.minor(s) : ev.minor)) {

            choice: idx, label: opt.label, kind: opt.kind || 'judgement',

        const cap = capacityOf(lv, s);
        const sold = Math.min(demand, have, cap);
        const wage = lv.staff && s.today.hired ? lv.staff.wage : 0;

          demand, sold, revenue, cogs: Math.round(cogs), spoiled, spoilCost: Math.round(spoilCost),
          rent: rentToday, wage, capacity: cap === Infinity ? null : cap, hired: s.today.hired, eventDelta: s.today.eventDelta || 0, profit: Math.round(dayProfit),

        s.today.record = rec;
        if (spoiled > 0) learn(s, ['損耗']);
        learn(s, ['利潤', '固定支出']);
        s.history.push({ day: s.day, cash: assets(s), pop: s.pop, stress: s.stress, hold: lv.market ? Math.round(holdingsValue(s)) : undefined });

      }
      case 'night': {
        if (action && action.borrow && lv.loan) {

  }

  function nightLine(data, s, rec) {
    const lines = data.nightLines;

    if (rec.demand > rec.sold * 1.3 && rec.sold > 0) return lines.stockout;
    if (rec.profit > 0 && rec.spoiled === 0) return lines.good;
    if (rec.profit < 0) return lines.loss;

  // 用同一個種子、同一串輸入重跑（平行世界）
  function replay(data, levelId, difficulty, seed, actions) {
    let s = createLevel(data, levelId, difficulty, seed);
    for (const a of actions) { s = step(data, s, a); if (s.done) break; }
    // 若輸入用完還沒結束，用「照常做」把關卡跑完
    while (!s.done) s = step(data, s, defaultAction(data, s));

  }
  function defaultAction(data, s) {
    const prod = productOf(data, s);
    const lv = levelOf(data, s);

    return { type: 'next' };
  }

  // ---------- 結算 ----------
  function settle(data, s) {
    const lv = levelOf(data, s);
    let total = assets(s);
    let tax = 0;
    if (lv.tax) {
      const pre = total - lv.startCash - (lv.extraStart || 0);
      const rate = lv.tax.rate * (s.flags.records ? (1 - lv.tax.recordsDiscount) : 1);
      tax = Math.max(0, Math.round(pre * rate));
      if (s.flags.taxEvaded) tax = 0;
      total -= tax;

    const passed = total >= s.goal && s.cash >= 0;
    const profit = total - lv.startCash - (lv.extraStart || 0);
    const goalProfit = s.goal - lv.startCash - (lv.extraStart || 0);

    if (passed) stars = 1;

        return { choice: i, label: r.optionLabels ? r.optionLabels[i] : optsOf(ev, s)[i].label, cash: assets(w), diff: assets(w) - total };
      });
      return { replayId: r.id, results };
    });
    const spoiledTotal = s.dayRecords.reduce((a, r) => a + r.spoiled, 0);
    const spoilCostTotal = s.dayRecords.reduce((a, r) => a + r.spoilCost, 0);
    const soldTotal = s.dayRecords.reduce((a, r) => a + r.sold, 0);
    const missedTotal = s.dayRecords.reduce((a, r) => a + Math.max(0, r.demand - r.sold), 0);
    const market = lv.market ? marketReport(data, lv, s) : null;
    const title = pickTitle(data, s, { passed, spoiledTotal, missedTotal, soldTotal, market });
    return {
      passed, stars, profit, goalProfit, title, total, tax, priceLevel: s.priceLevel || 1, loanOutstanding: loanOutstanding(s),
      spoiledTotal, spoilCostTotal, soldTotal, missedTotal, market,
      worlds, grandma: grandmaVerdict(data, lv, s, { passed, spoiledTotal, missedTotal, stars }),

  }
  // 市場回顧：投資賺了多少、付了多少費用、有沒有恐慌賣出
  function marketReport(data, lv, s) {
    const m = marketOf(s);
    const invested = m.trades.filter((t) => t.kind === 'buy').reduce((a, t) => a + t.cash, 0);

  function actionDay(actions, i) {

  // ---------- 關卡地圖 ----------
  const upcoming = [];
  function unlocked(id) { return id === 1 || !!(save.progress[id - 1] && save.progress[id - 1].stars > 0); }
  function mapScreen() {
    show('map', `
      <div class="topbar"><button class="back" id="back">‹ 回首頁</button><span class="muted">難度：${E.DIFF[save.difficulty].label}</span></div>
      ${[{ n: 1, t: '篇章一　小店篇', m: '溫馨為主', d: '每一關五到八天，一關約 10 分鐘。第 4 關起可以存錢，第 7 關起可以請人。' }, { n: 2, t: '篇章二　街區篇', m: '溫馨加搞笑', d: '通膨、複利、貸款、保險、稅、信用。打烊後的面板會多出貸款與保險。' }, { n: 3, t: '篇章三　城市篇', m: '搞笑加一點緊張', d: '第一次投資、分散、市場震盪、利率、股息、槓桿、匯率、泡沫。打烊後可以買賣虛構的投資商品，過關看總資產。' }, { n: 4, t: '篇章四　暗流篇', m: '緊張加一點溫馨', d: '保證獲利群組、假 App、殺豬盤、借錢投資、老鼠會、假銀行來電、假代言，最後是阿嬤差點被騙。騙子的話術照真的寫，認得出來才有用。' }].map((ch) => `<div class="panel">
        <div class="chapter-head"><h2>${ch.t}</h2><span class="muted">${ch.m}</span></div>
        <p class="muted">${ch.d}</p>
        <div class="levels">
          ${D.levels.filter((l) => l.chapter === ch.n).map((lv) => { const p = save.progress[lv.id]; const ok = unlocked(lv.id); return `
            <button class="level-card" data-level="${lv.id}" ${ok ? '' : 'disabled'}>
              <div class="no">${lv.id}</div>
              <div><div class="t">${esc(lv.title)}</div><div class="s">${esc(lv.theme)}${p ? ` · 最佳 ${money(p.best)}` : ''}</div></div>
              <div class="stars">${p ? '★'.repeat(p.stars) + '<span style="opacity:.3">' + '★'.repeat(3 - p.stars) + '</span>' : (ok ? '' : '🔒')}</div>
            </button>`; }).join('')}
          ${ch.n === 4 ? upcoming.map((u) => `<button class="level-card" disabled><div class="no">${u.id}</div><div><div class="t">${u.title}</div><div class="s">${u.theme} · 下個版本</div></div><div class="stars">🔒</div></button>`).join('') : ''}
        </div>
      </div>`).join('')}
    `);
    $('#back').addEventListener('click', titleScreen);
    app.querySelectorAll('[data-level]').forEach((b) => b.addEventListener('click', () => startLevel(+b.dataset.level)));
  }

  // ---------- 關卡流程 ----------
  let G = null; // { state, view, levelId }
  function startLevel(levelId) {
    const lv = D.levels.find((l) => l.id === levelId);
    const seed = 'L' + levelId + '-' + save.difficulty + '-' + (save.seedCounter++);
    const state = E.createLevel(D, levelId, save.difficulty, seed);
    G = { state, view: 'intro', introIdx: 0, lastCash: state.cash, lastPop: state.pop, lastStress: state.stress };
    save.current = null; persist();
    introScreen(lv);
  }
  function resumeLevel() {
    const c = save.current; if (!c) return titleScreen();
    G = { state: c.state, view: c.view, lastCash: c.state.cash, lastPop: c.state.pop, lastStress: c.state.stress };
    renderPlay();
  }
  function saveCurrent() { if (G && !G.state.done) { save.current = { state: G.state, view: G.view }; } else { save.current = null; } persist(); }

  function introScreen(lv) {
    const line = lv.intro[G.introIdx];
    const ch = D.characters[line.who];
    const last = G.introIdx >= lv.intro.length - 1;
    show('intro', `
      <div class="scene" data-time="morning">${SceneSVG.render({ time: 'morning', cat: 'sleep' })}</div>
      <div class="panel">
        <div class="eyebrow">第 ${lv.id} 關　${esc(lv.title)}</div>
        <div class="dialog"><div class="avatar">${avatarOf(line.who)}</div><div class="bubble"><div class="who" style="color:${ch.color}">${ch.name}</div><div class="text">${withTerms(line.text)}</div></div></div>
        <div class="preview">
          <div class="kv"><div class="k">起始資金</div><div class="v">${money(lv.startCash)}</div></div>
          <div class="kv"><div class="k">過關目標</div><div class="v">${money(G.state.goal)}</div></div>
          <div class="kv"><div class="k">天數</div><div class="v">${lv.days} 天</div></div>
          <div class="kv"><div class="k">商品</div><div class="v">${D.products[lv.product].icon} ${D.products[lv.product].name}</div></div>
        </div>
        <button class="btn block" id="next">${last ? '開始第一天' : '繼續 ›'}</button>
      </div>`);
    $('#next').addEventListener('click', () => {
      if (last) { G.view = 'morning'; stepNext(); } else { G.introIdx++; introScreen(lv); }
    });
  }
  function avatarOf(who) { return { grandma: '👵', player: '🧢', cat: '🐱', customer: '🙋', neighbor: '💁‍♀️', xiaoma: '🏍️', wang: '🎩' }[who] || '🙂'; }

  function stepNext() { doStep({ type: 'next' }); }
  function doStep(action) {
    G.lastCash = G.state.cash; G.lastPop = G.state.pop; G.lastStress = G.state.stress;
    G.state = E.step(D, G.state, action);
    // 新的一天：早晨的資訊由引擎算出來（天氣、新聞、今天的事件）
    if (G.state.phase === 'morning' && !G.state.done) G.state = E.step(D, G.state, { type: 'next' });
    G.state.learned.forEach(learnTerm);
    // 由引擎的 phase 決定要顯示的畫面
    G.view = { shop: 'morning', event: 'event', close: 'eventResult', night: 'ledger', done: 'settle' }[G.state.phase];
    saveCurrent();
    renderPlay();
  }

  function timeOf(view) { return { morning: 'morning', shop: 'morning', event: 'noon', eventResult: 'noon', ledger: 'evening', night: 'night' }[view] || 'morning'; }
  function catMood(s) { return s.cash < 0 ? 'shock' : s.stress >= 60 ? 'awake' : 'sleep'; }

  function lvOf(s) { return D.levels.find((l) => l.id === s.levelId); }
  function hud(s) {
    const d = (now, before, suffix) => { const x = now - before; if (!x) return ''; return `<span class="delta ${x > 0 ? 'up' : 'down'}">${x > 0 ? '+' : ''}${suffix ? fmt(x) : x}</span>`; };
    const stat = (k, label, value, bar, delta, term) => `<div class="stat" data-k="${k}"><div class="label"><span>${label}</span><button class="help-btn" data-term="${term}" aria-label="${label}是什麼？">?</button></div><div class="value">${value}</div>${bar !== null ? `<div class="bar"><i style="width:${bar}%"></i></div>` : ''}${delta}</div>`;
    return `<div class="hud">
      ${stat('cash', '資金', money(s.cash), null, d(s.cash, G.lastCash, true), '利潤')}
      ${stat('pop', '人氣', s.pop, s.pop, d(s.pop, G.lastPop), '人氣')}
      ${stat('stress', '壓力', s.stress, s.stress, d(s.stress, G.lastStress), '壓力')}
      ${stat('credit', '信用', s.credit, s.credit, '', '現金流')}
    </div>
    ${lvOf(s).bank ? `<div class="bankline"><span>🏦 活存 <b class="num">${money(E.bankOf(s).demand)}</b></span><span>🔒 定存 <b class="num">${money(E.bankOf(s).fixed.reduce((a, f) => a + f.amount, 0))}</b></span>${E.loanOutstanding(s) ? `<span>💳 待還 <b class="num">${money(E.loanOutstanding(s))}</b></span>` : ''}${lvOf(s).insurance ? `<span>🛡️ ${s.insured ? '已投保' : '未投保'}</span>` : ''}${lvOf(s).market ? `<span>📊 持股 <b class="num">${money(E.holdingsValue(s))}</b></span>` : ''}${s.market && s.market.margin > 0 ? `<span>🧨 融資欠款 <b class="num">${money(s.market.margin)}</b></span>` : ''}${(s.priceLevel || 1) > 1 ? `<span>📈 物價 <b class="num">${Math.round(s.priceLevel * 100)}%</b></span>` : ''}<span>總資產 <b class="num">${money(E.assets(s))}</b> / 目標 ${money(s.goal)}</span></div>` : ''}`;
  }

  function renderPlay() {
    const s = G.state, lv = D.levels.find((l) => l.id === s.levelId), prod = D.products[lv.product];
    if (G.view === 'settle') return settleScreen();
    const weatherIcon = s.today ? { rain: '🌧️', hot: '☀️', sunny: '⛅' }[s.today.weather] : '';
    const time = timeOf(G.view);
    const body = {
      morning: viewMorning, shop: viewShop, event: viewEvent, eventResult: viewEventResult, ledger: viewLedger, night: viewNight,
    }[G.view](s, lv, prod);
    show('play', `
      <div class="scene" data-time="${time}">${SceneSVG.render({ time, cat: catMood(s), grandma: G.view !== 'event' })}
        <div class="day-badge">第 ${s.day} / ${s.days} 天 · ${{ morning: '早晨', noon: '中午', evening: '打烊', night: '夜晚' }[time]}</div>
        <div class="weather-badge">${weatherIcon}</div>
      </div>
      ${hud(s)}
      <div class="panel" id="panel">${body}</div>
      <div class="btn-row"><button class="btn secondary" id="btn-quit">暫停回首頁（會保留進度）</button></div>
    `);
    $('#btn-quit').addEventListener('click', () => { saveCurrent(); titleScreen(); });
    bindView(s, lv, prod);
  }

  // 教學（第一次玩才出現）
  function coach(key, text) {
    if (save.tutorial[key]) return '';
    return `<div class="coach" data-coach="${key}"><div class="icon">👵</div><div class="text">${withTerms(text)}</div><button class="chip" data-coach-ok="${key}">知道了</button></div>`;
  }
  function bindCoach() {
    app.querySelectorAll('[data-coach-ok]').forEach((b) => b.addEventListener('click', () => { save.tutorial[b.dataset.coachOk] = true; persist(); b.closest('.coach').remove(); }));
  }

  // --- 早晨 ---
  function viewMorning(s, lv, prod) {
    const t = s.today;
    const have = E.stockQty(s);
    return `
      <div class="eyebrow">早晨 · 看看今天</div>
      ${coach('hud', '上面四個數字：資金是你手上的錢，人氣決定客人多少，壓力太高會手忙腳亂。看不懂的字點一下「?」或底線，我會解釋。')}
      <div class="news">
        ${t.news.length ? t.news.map((n) => `<div class="news-item ${n.delayed ? 'delayed' : ''}"><div class="icon">${n.icon}</div><div>${withTerms(n.text)}${n.cash ? ` <b class="num">(${n.cash > 0 ? '+' : ''}${fmt(n.cash)})</b>` : ''}</div></div>`).join('') : `<div class="news-item"><div class="icon">📰</div><div>今天沒什麼新聞，天氣不錯。</div></div>`}
        ${have > 0 ? `<div class="news-item"><div class="icon">📦</div><div>店裡還有昨天剩下的 ${prod.name} <b>${have} ${prod.unit}</b>（庫存）。</div></div>` : ''}
      </div>
      <div class="dialog"><div class="avatar">👵</div><div class="bubble"><div class="who" style="color:${D.characters.grandma.color}">阿嬤</div><div class="text">${withTerms(morningLine(s, lv))}</div></div></div>
      <button class="btn block" id="go-shop">去準備開店 ›</button>`;
  }
  function morningLine(s, lv) {
    if (s.today.closed) return '颱風天，今天不用進貨也沒客人。房租照付，休息一天吧。';
    const est = s.today.estimate;
    const lo = Math.round(est * 0.85), hi = Math.round(est * 1.15);
    if (s.day === 1) return `第一天，我看今天大概會來 ${lo} 到 ${hi} 個客人。做太多會丟，做太少會少賺，你自己拿捏。`;
    const y = s.dayRecords[s.dayRecords.length - 1];
    let line = `昨天來了 ${y.demand} 個客人、賣出 ${y.sold} ${D.products[lv.product].unit}。今天我估大概 ${lo} 到 ${hi} 個。`;
    if (y.spoiled > 0) line += ` 昨天丟了 ${y.spoiled} ${D.products[lv.product].unit}，心痛喔。`;
    if (y.demand > y.sold * 1.2) line += ' 昨天有人買不到，人氣會掉。';
    return line;
  }

  // --- 開店 ---
  function viewShop(s, lv, prod) {
    const est = s.today.estimate, have = E.stockQty(s);
    if (s.today.closed) return `
      <div class="eyebrow">颱風天 · 停業</div>
      <div class="news-item"><div class="icon">🌀</div><div>全市停班停課，今天沒有客人。房租 ${money(s.rent)} 照付。冰箱裡還有 ${have} ${prod.unit}。</div></div>
      <button class="btn block" id="open">休息一天 ›</button>`;
    const max = Math.max(60, Math.round(est * 2.2));
    const def = Math.max(0, est - have);
    const affordable = s.cash + (lv.bank ? E.bankOf(s).demand : 0);
    const refNow = E.refPriceNow(D, s);
    const prices = [0.8, 0.9, 1, 1.15, 1.3].map((m) => Math.round(refNow * m));
    const costNow = E.unitCost(prod, 0, s);
    return `
      <div class="eyebrow">開店 · 進貨與定價</div>
      ${coach('shop', `今天要做幾${prod.unit}、賣多少錢，這兩件事決定今天賺不賺。成本每${prod.unit} ${prod.cost} 元，我以前賣 ${prod.refPrice}。進貨的錢現在就要付。`)}
      ${costNow !== prod.cost ? `<div class="tip"><div class="icon">📈</div><div>現在每${prod.unit}成本 <b>${costNow}</b> 元（原本 ${prod.cost}）。客人目前能接受的價格大約 <b>${refNow}</b> 元。</div></div>` : ''}
      <p class="muted">${prod.icon} ${esc(prod.name)}：${withTerms(prod.note)}${have ? `　目前庫存 ${have} ${prod.unit}。` : ''}</p>
      <div class="field">
        <label><span>進貨數量（${prod.unit}）</span><span class="muted">阿嬤估 ${Math.round(est * 0.85)}–${Math.round(est * 1.15)} 位客人</span></label>
        <div class="stepper">
          <button type="button" data-q="-10" aria-label="減少 10">−</button>
          <input type="range" id="qty" min="0" max="${max}" step="5" value="${def}" aria-label="進貨數量">
          <button type="button" data-q="10" aria-label="增加 10">+</button>
          <div class="val num" id="qty-val">${def}</div>
        </div>
        <div class="chips">
          <button class="chip" data-qset="${Math.max(0, Math.round(est * 0.8) - have)}">保守</button>
          <button class="chip" data-qset="${def}">剛好</button>
          <button class="chip" data-qset="${Math.max(0, Math.round(est * 1.25) - have)}">多一點</button>
          ${prod.bulk ? `<button class="chip" data-qset="${prod.bulk.qty}">${prod.bulk.qty}（${Math.round((1 - prod.bulk.discount) * 10)}折）</button>` : ''}
        </div>
      </div>
      ${lv.staff ? `<div class="field"><label><span>人手</span><span class="muted">你一個人一天最多 ${lv.capacity} ${prod.unit}</span></label>
        <div class="chips"><button class="chip" id="hire" aria-pressed="${est > lv.capacity + 40}">請${lv.staff.name}來上班（+${lv.staff.capacity} ${prod.unit}，薪資 ${money(lv.staff.wage)}）</button></div></div>` : ''}
      <div class="field">
        <label><span>售價（每${prod.unit}）</span><span class="muted">參考價 ${refNow} 元</span></label>
        <div class="chips" id="prices">${prices.map((p) => `<button class="chip" data-p="${p}" aria-pressed="${p === refNow}">${p} 元</button>`).join('')}</div>
      </div>
      <div class="preview">
        <div class="kv"><div class="k">進貨要付</div><div class="v num" id="pv-cost">—</div></div>
        <div class="kv"><div class="k">每${prod.unit}賺</div><div class="v num" id="pv-margin">—</div></div>
        <div class="kv"><div class="k">全部賣完可收</div><div class="v num" id="pv-rev">—</div></div>
        <div class="kv"><div class="k">今天房租</div><div class="v num">−${money(s.rent)}</div></div>
      </div>
      <div class="tip"><div class="icon">👵</div><div id="pv-tip"></div></div>
      <button class="btn block" id="open">開始營業 ›</button>`;
  }
  function bindShop(s, lv, prod) {
    const qty = $('#qty'), qv = $('#qty-val');
    const refNow = E.refPriceNow(D, s);
    let price = refNow;
    const est = s.today.estimate, have = E.stockQty(s);
    const hireBtn = $('#hire');
    const hired = () => !!(hireBtn && hireBtn.getAttribute('aria-pressed') === 'true');
    const affordable = s.cash + (lv.bank ? E.bankOf(s).demand : 0);
    const update = () => {
      let q = +qty.value;
      const ucTry = E.unitCost(prod, q, s);
      if (q * ucTry > affordable) { q = Math.floor(affordable / ucTry / 5) * 5; qty.value = q; toast('錢不夠，最多只能進 ' + q + ' ' + prod.unit); }
      qv.textContent = q;
      const uc = E.unitCost(prod, q, s);
      const cap = (lv.capacity || Infinity) + (hired() ? lv.staff.capacity : 0);
      const total = q + have;
      $('#pv-cost').textContent = '−' + money(q * uc) + (uc < prod.cost ? ' 🏷️' : '');
      $('#pv-margin').textContent = (price - uc) + ' 元';
      $('#pv-rev').textContent = money(total * price);
      let tip;
      const pf = E.priceFactor(price, refNow);
      const expect = Math.round(est * pf);
      if (total === 0) tip = '一個都不做？那今天房租還是要付喔。';
      else if (total > cap) tip = `${hired() ? '就算有' + lv.staff.name : '你一個人'}一天最多做 ${cap} ${prod.unit}，多的 ${total - cap} ${prod.unit}會做不出來。`;
      else if (lv.staff && hired() && expect < lv.capacity) tip = `我估只有 ${expect} 個客人，你自己就做得完，請${lv.staff.name}的 ${money(lv.staff.wage)} 會白花。`;
      else if (lv.staff && !hired() && expect > lv.capacity + 30) tip = `我估 ${expect} 個客人，你一個人最多 ${lv.capacity}，剩下的會買不到。`;
      else if (total > expect * 1.4) tip = `我估賣 ${expect} 左右，你準備 ${total}，剩下的${prod.spoil >= 1 ? '明天就不能賣了' : '會慢慢壞掉'}。`;
      else if (total < expect * 0.7) tip = `我估賣 ${expect} 左右，你只準備 ${total}，有客人會買不到，人氣會掉。`;
      else if (price > refNow * 1.2) tip = '賣這麼貴，每顆賺多，但客人會變少，而且會記得。';
      else if (price < refNow * 0.85) tip = '便宜賣客人多，但每顆賺很少，算一算划不划算。';
      else tip = `照這樣，賣得順的話今天大概賺 ${money(Math.min(expect, total, cap) * price - q * uc - s.rent - (hired() ? lv.staff.wage : 0))}。`;
      if (s.cash < q * uc) tip += `（手上現金不夠，會自動從活存領 ${money(q * uc - s.cash)}。）`;
      $('#pv-tip').innerHTML = withTerms(tip);
    };
    qty.addEventListener('input', update);
    app.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => { qty.value = Math.max(0, Math.min(+qty.max, +qty.value + +b.dataset.q)); update(); }));
    app.querySelectorAll('[data-qset]').forEach((b) => b.addEventListener('click', () => { const v = +b.dataset.qset; if (v > +qty.max) qty.max = v; qty.value = v; update(); }));
    app.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => { price = +b.dataset.p; app.querySelectorAll('[data-p]').forEach((x) => x.setAttribute('aria-pressed', x === b)); update(); }));
    if (hireBtn) hireBtn.addEventListener('click', () => { hireBtn.setAttribute('aria-pressed', !hired()); update(); });
    $('#open').addEventListener('click', () => { G.view = 'shop'; doStep({ qty: +qty.value, price, hire: hired() }); });
    update();
  }

  // --- 事件 ---
  let timerHandle = null;
  function viewEvent(s) {
    const ev = D.events.find((e) => e.id === s.today.eventId);
    const ch = D.characters[ev.who] || D.characters.customer;
    const secs = eventSeconds(s);
    return `
      <div class="eyebrow">中午 · 發生了一件事</div>
      ${coach('event', '每天中午會有一件事。選項沒有標準答案，但後果有的馬上出現，有的要過幾天。結算時我們一起回頭看。')}
      <div class="card-ev">
        <div class="title">${esc(ev.title)}</div>
        <div class="dialog"><div class="avatar">${avatarOf(ev.who)}</div><div class="bubble"><div class="who" style="color:${ch.color}">${ch.name}</div><div class="text">${withTerms(typeof ev.text === 'function' ? ev.text(s) : ev.text)}</div></div></div>
        ${secs ? `<div class="timer" aria-label="倒數"><i id="timer-bar"></i></div><div class="muted" id="timer-txt">壓力大，要快點決定：${secs} 秒</div>` : ''}
        <div class="options">${E.optsOf(ev, s).map((o, i) => { const ok = E.optionAllowed(o, s); return `<button class="opt" data-opt="${i}" ${ok ? '' : 'disabled'}><span class="l">${esc(o.label)}</span>${!ok ? `<span class="k">💸 手上現金不夠（需要 ${money(o.minCash)}，你有 ${money(s.cash)}）</span>` : o.kind === 'luck' ? '<span class="k">🎲 結果看運氣</span>' : ''}</button>`; }).join('')}</div>
      </div>`;
  }

  // --- 投資面板（篇章三） ---
  function spark(hist, w, h) {
    if (!hist || hist.length < 2) return '';
    const lo = Math.min(...hist), hi = Math.max(...hist), span = Math.max(1e-9, hi - lo);
    const pts = hist.map((v, i) => `${(i / (hist.length - 1) * w).toFixed(1)},${(h - 2 - (v - lo) / span * (h - 4)).toFixed(1)}`).join(' ');
    const up = hist[hist.length - 1] >= hist[0];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? 'var(--good)' : 'var(--bad)'}" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }
  function riskStars(n) { return '<span class="risk">' + '●'.repeat(n) + '<span style="opacity:.25">' + '●'.repeat(5 - n) + '</span></span>'; }
  function feeLine(p, s) {
    if (p.hiddenFee && !s.flags.askedFee) return '費用：小王沒說。<b>你沒問。</b>';
    const parts = [];
    if (p.buyFee) parts.push((p.id === 'coin' ? '換匯價差 ' : '買進 ') + (p.buyFee * 100).toFixed(1) + '%');
    if (p.dailyFee) parts.push('每天管理費 ' + (p.dailyFee * 100).toFixed(2) + '%');
    if (p.payout) parts.push((p.payoutIn === 'units' ? '利息每天 ' : '配息每天 ') + (p.payout * 100).toFixed(1) + '%');
    return '費用：' + (parts.length ? parts.join('、') : '無（小心，免費的最貴）');
  }

        return `<div class="mkt-card" data-mkt="${p.id}">
          <div class="mkt-head"><div class="mkt-name">${p.icon} <b>${esc(p.name)}</b> ${riskStars(p.risk)}</div><div class="mkt-price num">${fmt(price)} <span class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '▲' : '▼'}${Math.abs(chg).toFixed(1)}%</span></div></div>
          <div class="mkt-body">${spark(h, 120, 32)}<div class="muted mkt-desc">${withTerms(p.what)}　<span class="muted">配息來源：${esc(p.source)}</span><br>${feeLine(p, s)}</div></div>
          <div class="mkt-hold muted">持有 <b class="num">${money(hold)}</b>${held && held.cost ? `（投入 ${money(held.cost)}，${hold >= held.cost ? '+' : '−'}${fmt(Math.abs(hold - held.cost))}）` : ''}</div>

          <div class="field"><label><span>${hold > 0 && !frozen ? '賣出 ◂　▸ 買進' : '買進'}</span><span class="muted num" id="tr-${p.id}-val">0</span></label>
            <input type="range" class="trade" id="tr-${p.id}" data-id="${p.id}" min="${frozen ? 0 : -Math.floor(hold / 1000) * 1000}" max="${Math.max(0, Math.floor(s.cash / 1000) * 1000)}" step="1000" value="0" aria-label="${esc(p.name)} 買賣金額"></div>
        </div>`; }).join('')}
      ${mg ? `<div class="field"><label><span>🧨 融資（向券商借錢買）</span><span class="muted">利息每天 ${(mg.rate * 100).toFixed(1)}%，欠款 ${money(m.margin)}</span></label>
        <p class="muted">最多用自己的 1 份買 ${mg.maxMul} 份。持股跌到欠款的 ${mg.maintain} 倍以下會被強制賣光（斷頭）。</p>
        ${room > 0 ? `<label><span>借多少</span><span class="muted num" id="mg-val">0</span></label><input type="range" id="mg" min="0" max="${room}" step="1000" value="0" aria-label="融資借款">` : ''}

  function bindNight(s, lv) {
    const breaks = [];

    const d = $('#bk-d'), f = $('#bk-f'), w = $('#bk-w');
    const trades = Array.from(app.querySelectorAll('input.trade')); const mg = $('#mg'), mgr = $('#mg-r');
    const tradeNet = () => trades.reduce((a, t) => a + (+t.value), 0) + (mgr ? +mgr.value : 0) - (mg ? +mg.value : 0);
    const updTrades = () => { trades.forEach((t) => { const v = +t.value; $('#tr-' + t.dataset.id + '-val').textContent = (v > 0 ? '買 ' : v < 0 ? '賣 ' : '') + money(Math.abs(v)); }); if (mg) $('#mg-val').textContent = money(+mg.value); if (mgr) $('#mg-r-val').textContent = money(+mgr.value); const net = tradeNet(); const tip = $('#mkt-tip'); if (tip) tip.textContent = net > 0 ? `買進共 ${money(net)}，睡醒後手上剩 ${money(s.cash - net)}。記得留明天進貨的錢。` : net < 0 ? `賣出共 ${money(-net)}，睡醒後手上 ${money(s.cash - net)}。` : '買賣在睡覺前成交，用今天的價格。'; };
    trades.concat([mg, mgr].filter(Boolean)).forEach((t) => t.addEventListener('input', () => { const buyTotal = trades.reduce((a, x) => a + Math.max(0, +x.value), 0) + (mgr ? +mgr.value : 0); const avail = s.cash + (mg ? +mg.value : 0) + trades.reduce((a, x) => a + Math.max(0, -x.value), 0); if (buyTotal > avail && +t.value > 0) t.value = Math.max(0, +t.value - (buyTotal - avail)); updTrades(); if (d) upd(); }));

          <div class="kv"><div class="k">丟掉</div><div class="v num">${r.spoiledTotal} ${prod.unit}（${money(r.spoilCostTotal)}）</div></div>
        </div>
      </div>
      <div class="panel">
        <h3>資金曲線</h3>
        ${chart(s)}
        <p class="muted">金色的點是你做重大決定的那幾天。${lv.market ? '虛線是持股市值（自己的比例尺，從底線往上）。' : ''}</p>
      </div>
      ${r.market ? marketSummary(r.market, s) : (s.flags.scamLoss ? `<div class="panel"><div class="tip"><div class="icon">🕳️</div><div>這關被騙走 <b>${money(s.flags.scamLoss)}</b>。真實世界這種錢通常拿不回來，能做的是立刻打 165 和銀行，把損失停在那一刻。</div></div></div>` : '')}
      <div class="panel">
        <h3>決策回放</h3>
        ${s.replay.length ? s.replay.map((rp, i) => replayItem(rp, r.worlds[i])).join('') : '<p class="muted">這一關沒有重大決定。</p>'}
        <h3>進貨回顧</h3>
        <div class="muted">${s.dayRecords.map((d) => `第 ${d.day} 天：進 ${d.qty}、賣 ${d.sold}${d.spoiled ? `、丟 ${d.spoiled}` : ''}${d.demand > d.sold ? `、少賣 ${d.demand - d.sold}` : ''}`).join('<br>')}</div>
      </div>
      ${r.passed && D.chapters[lv.chapter] && lv.id === Math.max(...D.levels.filter((l) => l.chapter === lv.chapter).map((l) => l.id)) ? chapterCard(D.chapters[lv.chapter]) : ''}
      <div class="panel">
        <div class="dialog"><div class="avatar">👵</div><div class="bubble"><div class="who" style="color:${D.characters.grandma.color}">阿嬤的評語</div><div class="text">${withTerms(r.grandma)}</div></div></div>
        <div class="tip"><div class="icon">📌</div><div>${withTerms(lv.lesson)}</div></div>
        ${newTerms.length ? `<p class="muted">📖 這關出現的名詞：${newTerms.map((t) => `<button class="term" data-term="${t}">${t}</button>`).join('　')}</p>` : ''}
        <div class="btn-row">
          <button class="btn secondary" id="retry">再玩一次</button>
          ${r.passed && D.levels.some((l) => l.id === lv.id + 1) ? `<button class="btn gold" id="next-level">下一關 ›</button>` : `<button class="btn" id="to-map">回關卡表</button>`}
        </div>
        <p class="footer-note">這是模擬，數字是虛構的。真實世界的成本、人氣與運氣比這裡複雜得多。</p>
      </div>`);
    $('#retry').addEventListener('click', () => startLevel(lv.id));
    const nl = $('#next-level'); if (nl) nl.addEventListener('click', () => startLevel(lv.id + 1));
    const tm = $('#to-map'); if (tm) tm.addEventListener('click', mapScreen);
  }
  function marketSummary(mk, s) {
    const rows = mk.byProduct.filter((b) => b.bought > 0 || b.held > 0).map((b) => `<div class="row-kv"><b>${b.icon} ${esc(b.name)}</b><span>投入 ${money(b.bought)}，拿回 ${money(b.sold + b.held)}（${b.sold + b.held >= b.bought ? '+' : '−'}${fmt(Math.abs(b.sold + b.held - b.bought))}）；這檔本身這關 ${b.change >= 0 ? '漲' : '跌'} ${Math.abs(b.change * 100).toFixed(0)}%</span></div>`).join('');
    return `<div class="panel">
      <h3>投資回顧</h3>
      ${mk.invested ? `<div class="preview">
        <div class="kv"><div class="k">投入</div><div class="v num">${money(mk.invested)}</div></div>
        <div class="kv"><div class="k">賺／賠</div><div class="v num" style="color:${mk.gain >= 0 ? 'var(--good)' : 'var(--bad)'}">${mk.gain >= 0 ? '+' : '−'}${fmt(Math.abs(mk.gain))}</div></div>
        <div class="kv"><div class="k">付了多少費用</div><div class="v num">${money(mk.fees)}</div></div>
        <div class="kv"><div class="k">收到配息／利息</div><div class="v num">${money(mk.dividends)}</div></div>
      </div>${rows}` : '<p class="muted">這一關你沒有投資。錢沒變少，也沒長大。</p>'}
      ${mk.scamLoss ? `<div class="tip"><div class="icon">🕳️</div><div>這關被騙走 <b>${money(mk.scamLoss)}</b>${mk.frozen.length ? '，還有一筆在「審核中」的平台裡，平台已經消失' : ''}。真實世界這種錢通常拿不回來，能做的是立刻打 165 和銀行，把損失停在那一刻。</div></div>` : ''}
      ${mk.liquidated ? `<div class="tip"><div class="icon">💥</div><div>這關你被<button class="term" data-term="爆倉">斷頭</button>了：券商在你最慘的那天把持股全賣掉。借來的錢放大的不是運氣，是賠率。</div></div>` : ''}
      ${mk.panic.length ? `<div class="tip"><div class="icon">😱</div><div>恐慌賣出 ${mk.panic.length} 次：${mk.panic.map((p) => `第 ${p.day} 天賣掉 ${esc(p.name)}（${money(p.cash)}），三天內它又漲回去了`).join('；')}。<button class="term" data-term="波動">波動</button>不等於虧損，賣掉才是。</div></div>` : ''}
      ${!mk.liquidated && !mk.panic.length && mk.products >= 3 ? `<div class="tip"><div class="icon">🧺</div><div>你把錢分在 ${mk.products} 個籃子裡。</div></div>` : ''}
    </div>`;
  }
  function replayItem(rp, world) {
    const worlds = world ? world.results.map((w) => `<div class="world">如果選「${esc(w.label)}」：最後總資產 ${money(w.cash)}（${w.diff >= 0 ? '+' : '−'}${fmt(Math.abs(w.diff))}）</div>`).join('') : '';
    return `<div class="replay-item">
      <div class="head"><b>第 ${rp.day} 天 · ${esc(rp.title)}</b><span class="tag ${rp.kind}">${rp.kind === 'luck' ? '運氣' : '判斷'}</span></div>
      <div>你選了「${esc(rp.label)}」${rp.delta ? `，當下資金 ${rp.delta > 0 ? '+' : ''}${fmt(rp.delta)}` : ''}。</div>
      ${rp.verdict ? `<div class="muted">👵 ${withTerms(rp.verdict)}</div>` : ''}
      ${worlds}
    </div>`;
  }
  function chapterCard(ch) {
    const rc = ch.realCard;
    return `<div class="panel chapter-done">
      <div class="eyebrow">🎉 ${esc(ch.title)} 完成</div>
      <h2>${esc(ch.done)}</h2>
      <div class="card-ev"><div class="title">${esc(rc.title)}</div><p class="muted">${esc(rc.intro)}</p>
        ${rc.items.map((it) => `<div class="row-kv"><b>${esc(it.k)}</b><span>${esc(it.v)}</span></div>`).join('')}
        <p class="muted">${esc(rc.note)}</p></div>
      <p class="muted">${esc(ch.next || '')}</p>
    </div>`;
  }
  function chart(s) {
    const W = 520, H = 180, padL = 56, padR = 16, padT = 16, padB = 28;
    const pts = s.history;
    const ys = pts.map((p) => p.cash).concat([s.goal]);
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const span = Math.max(1, hi - lo);
    const x = (d) => padL + (d / Math.max(1, s.days)) * (W - padL - padR);
    const y = (c) => padT + (1 - (c - lo) / span) * (H - padT - padB);
    const decisionDays = new Set(s.replay.map((r) => r.day));
    const line = pts.map((p) => `${x(p.day).toFixed(1)},${y(p.cash).toFixed(1)}`).join(' ');
    const area = `${x(0).toFixed(1)},${y(lo).toFixed(1)} ${line} ${x(pts[pts.length - 1].day).toFixed(1)},${y(lo).toFixed(1)}`;
    const ticks = [lo, (lo + hi) / 2, hi];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="資金曲線">
      ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-2)">${fmt(t / 1000)}k</text>`).join('')}
      <line x1="${padL}" x2="${W - padR}" y1="${y(s.goal).toFixed(1)}" y2="${y(s.goal).toFixed(1)}" stroke="var(--good)" stroke-dasharray="4 4"/>
      <text x="${W - padR}" y="${(y(s.goal) - 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--good)">目標</text>
      <polygon points="${area}" fill="var(--primary)" opacity=".12"/>
      <polyline points="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.some((p) => p.hold) ? `<polyline points="${(() => { const mh = Math.max(1, ...pts.map((p) => p.hold || 0)); const yh = (h) => (H - padB) - (h / mh) * (H - padT - padB) * 0.45; return pts.map((p) => `${x(p.day).toFixed(1)},${yh(p.hold || 0).toFixed(1)}`).join(' '); })()}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 3"/><text x="${W - padR}" y="${H - padB - 6}" text-anchor="end" font-size="11" fill="var(--gold-ink)" style="paint-order:stroke" stroke="var(--surface)" stroke-width="3">虛線：持股市值</text>` : ''}
      ${pts.map((p) => `<circle cx="${x(p.day).toFixed(1)}" cy="${y(p.cash).toFixed(1)}" r="${decisionDays.has(p.day) ? 6 : 3.5}" fill="${decisionDays.has(p.day) ? 'var(--gold)' : 'var(--primary)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
      ${pts.map((p) => `<text x="${x(p.day).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${p.day === 0 ? '開始' : '第' + p.day + '天'}</text>`).join('')}
    </svg>`;
  }

  // ---------- 圖鑑 ----------
  function glossaryScreen() {
    show('glossary', `
      <div class="topbar"><button class="back" id="back">‹ 回首頁</button><span class="muted">已收集 ${save.learned.length}/${termNames.length}</span></div>
      <div class="panel">
        <h2>📖 名詞圖鑑</h2>
        <p class="muted">玩到的名詞會自動收進來。每個都有白話說法、開店比喻和現實對照。</p>
        <div class="terms">${termNames.map((t) => { const k = save.learned.includes(t); return `<button class="term-card" ${k ? `data-term="${t}"` : 'disabled'}><div class="n">${k ? esc(t) : '？？？'}</div><div class="p">${k ? esc(D.glossary[t].plain) : '還沒遇到'}</div></button>`; }).join('')}</div>
      </div>`);
    $('#back').addEventListener('click', titleScreen);
    app.querySelectorAll('.term-card[data-term]').forEach((b) => b.addEventListener('click', () => showTerm(b.dataset.term)));
  }

  // ---------- 設定 ----------
  function settingsScreen() {
    show('settings', `
      <div class="topbar"><button class="back" id="back">‹ 回首頁</button></div>
      <div class="panel">
        <h2>⚙️ 設定</h2>
        <div class="field"><label>難度</label>
          <div class="diff-row">${Object.entries(E.DIFF).map(([k, v]) => `<button class="chip" data-diff="${k}" aria-pressed="${save.difficulty === k}">${v.label}</button>`).join('')}</div>
        </div>
        <div class="field"><label>存檔</label>
          <p class="muted">進度存在這個瀏覽器裡。換裝置不會帶著走（帳號同步是之後的功能）。</p>
          <button class="btn secondary" id="reset">清除所有進度</button>
          <div id="reset-confirm" hidden class="tip"><div class="icon">⚠️</div><div>確定要清掉關卡進度、圖鑑和教學紀錄嗎？<div class="btn-row" style="margin-top:8px"><button class="btn secondary" id="reset-no">取消</button><button class="btn" id="reset-yes" style="background:var(--roof)">確定清除</button></div></div></div>
        </div>
        <div class="field"><label>關於</label>
          <p class="muted">《淘氣大亨：阿嬤的小店》是給理財新手的經營模擬遊戲。所有商品、人物、公司都是虛構的，不推薦任何真實投資；遊戲裡學到的是觀念，真要投資前仍要自己多查資料。</p>
          <p class="muted">這個版本：四個篇章共 32 關。資料驅動的關卡與事件、固定種子的市場、延遲後果、決策回放與平行世界。</p>
        </div>
      </div>`);
    $('#back').addEventListener('click', titleScreen);
    app.querySelectorAll('[data-diff]').forEach((b) => b.addEventListener('click', () => { save.difficulty = b.dataset.diff; persist(); settingsScreen(); }));
    $('#reset').addEventListener('click', () => { $('#reset-confirm').hidden = false; });
    $('#reset-no').addEventListener('click', () => { $('#reset-confirm').hidden = true; });
    $('#reset-yes').addEventListener('click', () => { resetSave(); toast('已清除'); titleScreen(); });
  }

  // ---------- 啟動 ----------
  function boot() { titleScreen(); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();

</script>
</body></html>
